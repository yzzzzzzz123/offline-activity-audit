  <title>参半渠道活动核销</title>
  <style id="canban-audit-style">
    :root {
      color-scheme: light;
      --page: #f4f6f8;
      --surface: #ffffff;
      --surface-soft: #f8fafb;
      --ink: #12171c;
      --ink-soft: #65717c;
      --ink-faint: #8b96a0;
      --line: #e2e8ed;
      --line-strong: #cbd5dc;
      --accent: #18a9f5;
      --accent-strong: #008ed8;
      --accent-soft: #ebf8ff;
      --danger: #d94c4c;
      --danger-soft: #fff2f2;
      --success: #16845d;
      --success-soft: #eef9f4;
      --teal: #087b83;
      --purple: #7352a3;
      --amber: #a66512;
      --settlement: #527489;
      --settlement-soft: #f1f6f8;
      --radius: 10px;
      --radius-small: 7px;
      --font-sans: "Microsoft YaHei UI", "PingFang SC", "HarmonyOS Sans SC", Arial, sans-serif;
      --font-number: "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--page);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.62;
      text-rendering: optimizeLegibility;
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, summary:focus-visible {
      outline: 3px solid rgba(24, 169, 245, .24);
      outline-offset: 2px;
    }

    .topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
    .topbar-inner {
      display: flex;
      align-items: center;
      gap: 18px;
      width: min(1600px, calc(100% - 40px));
      min-height: 64px;
      margin: 0 auto;
    }
    .brand-mark { position: relative; display: inline-flex; align-items: baseline; padding: 0 25px 8px 0; color: #050607; white-space: nowrap; }
    .brand-mark strong { font-size: 28px; font-weight: 900; letter-spacing: -.1em; line-height: 1; }
    .brand-mark small { position: absolute; right: 0; bottom: 0; color: #11171c; font-family: var(--font-number); font-size: 8px; font-weight: 800; letter-spacing: .08em; line-height: 1; }
    .top-divider { width: 1px; height: 24px; background: var(--line-strong); }
    .product-lockup { min-width: 0; }
    h1 { margin: 0; font-size: 17px; font-weight: 760; letter-spacing: -.01em; }

    .app-shell {
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr);
      gap: 18px;
      width: min(1600px, calc(100% - 40px));
      margin: 18px auto 48px;
    }
    .side-panel {
      position: sticky;
      top: 14px;
      align-self: start;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .side-heading { padding: 14px 15px 11px; border-bottom: 1px solid var(--line); }
    .side-heading strong { font-size: 15px; font-weight: 760; }
    .scenario-tabs { display: grid; gap: 5px; padding: 9px; }
    .tab-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      color: var(--ink-soft);
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-small);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }
    .tab-button:hover { color: var(--ink); background: var(--surface-soft); }
    .tab-button[aria-selected="true"] {
      color: #007dbd;
      background: var(--accent-soft);
      border-color: #ccecff;
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .tab-button small { color: var(--ink-faint); font-family: var(--font-number); font-size: 10px; font-weight: 650; }
    .side-actions { padding: 9px; border-top: 1px solid var(--line); }

    .workspace, .workspace-stack { min-width: 0; }
    .workspace-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      min-height: 58px;
      padding: 4px 2px 12px;
    }
    .workspace-head h2 { margin: 0; font-size: clamp(20px, 2vw, 26px); font-weight: 780; line-height: 1.3; letter-spacing: -.025em; }

    .home-view {
      position: relative;
      min-width: 0;
      min-height: calc(100vh - 100px);
      padding: clamp(14px, 1.6vw, 24px);
      overflow: hidden;
      border: 1px solid #d7e0e4;
      background:
        radial-gradient(circle at 88% -16%, rgba(24, 169, 245, .12), transparent 26rem),
        linear-gradient(145deg, #f2f5f6 0%, #e7edef 50%, #eff3f4 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .86);
    }
    .home-cockpit {
      position: relative;
      display: grid;
      min-height: 198px;
      margin-bottom: 18px;
      overflow: hidden;
      border: 1px solid #c7d2d7;
      background: linear-gradient(112deg, rgba(255, 255, 255, .98), rgba(239, 244, 246, .97));
      filter: drop-shadow(0 12px 10px rgba(31, 48, 57, .10));
      clip-path: polygon(0 0, calc(100% - 21px) 0, 100% 21px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
      grid-template-columns: minmax(265px, .82fr) minmax(620px, 1.8fr);
      isolation: isolate;
    }
    .home-cockpit::before {
      position: absolute;
      z-index: 4;
      top: -1px;
      right: 7%;
      width: min(34%, 360px);
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent) 18%, var(--accent) 82%, transparent);
      content: "";
      pointer-events: none;
    }
    .home-cockpit-intro {
      position: relative;
      display: flex;
      min-width: 0;
      padding: 28px clamp(22px, 2vw, 34px);
      align-items: center;
      border-right: 1px solid rgba(171, 186, 193, .66);
      background:
        radial-gradient(circle at 28% 50%, rgba(255, 255, 255, .96), transparent 62%),
        linear-gradient(145deg, #f6f9fa, #e8eef0);
    }
    .home-cockpit-intro::after {
      position: absolute;
      right: 20px;
      bottom: 18px;
      width: 42px;
      height: 1px;
      background: var(--accent);
      box-shadow: 12px -6px 0 -0.25px rgba(24, 169, 245, .34);
      content: "";
    }
    .home-title-lockup { min-width: 0; }
    .home-title-lockup h2 {
      margin: 0;
      font-size: clamp(26px, 2.5vw, 36px);
      font-weight: 820;
      line-height: 1.12;
      letter-spacing: -.055em;
    }
    .home-state {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 18px;
      color: #506068;
      font-size: 11px;
      font-weight: 700;
    }
    .home-state::before {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border: 2px solid #fff;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 1px rgba(22, 132, 93, .25);
      content: "";
    }
    .home-state.issue::before { background: var(--danger); box-shadow: 0 0 0 1px rgba(217, 76, 76, .25); }
    .home-summary-grid {
      display: grid;
      min-width: 0;
      align-self: stretch;
      background: rgba(250, 252, 253, .76);
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .home-overview-metric {
      position: relative;
      display: flex;
      min-width: 0;
      padding: 28px clamp(14px, 1.6vw, 24px);
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid rgba(171, 186, 193, .56);
    }
    .home-overview-metric:last-child { border-right: 0; }
    .home-overview-metric span { color: #6a7880; font-size: 11px; font-weight: 700; }
    .home-overview-metric strong {
      display: block;
      margin-top: 8px;
      color: #1c282e;
      font-family: var(--font-number);
      font-size: clamp(31px, 3vw, 44px);
      font-weight: 720;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.055em;
      line-height: .95;
    }
    .home-overview-metric.accent strong { color: var(--accent-strong); }
    .home-overview-metric.pass strong { color: var(--success); }
    .home-overview-metric.issue strong { color: var(--danger); }
    .home-scenarios { min-width: 0; }
    .home-section-head {
      display: flex;
      min-height: 42px;
      padding: 0 2px 9px;
      align-items: center;
      gap: 12px;
    }
    .home-section-head::after { height: 1px; flex: 1; background: #cfd9dd; content: ""; }
    .home-section-head h3 { margin: 0; font-size: 17px; font-weight: 780; letter-spacing: -.02em; }
    .scenario-overview-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .scenario-entry {
      --scenario-tone: var(--amber);
      --scenario-wash: #fff8ed;
      position: relative;
      display: grid;
      min-width: 0;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid #ced9de;
      filter: drop-shadow(0 6px 6px rgba(31, 48, 57, .07));
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
      grid-template-rows: auto 1fr auto;
      transition: border-color 200ms ease, filter 200ms ease;
    }
    .scenario-entry::before { position: absolute; z-index: 2; top: 0; right: 0; left: 0; height: 3px; background: var(--scenario-tone); content: ""; }
    .scenario-entry:hover { border-color: #b8c8cf; filter: drop-shadow(0 8px 8px rgba(31, 48, 57, .10)); }
    .scenario-entry.personnel { --scenario-tone: var(--purple); --scenario-wash: #f6f1fb; }
    .scenario-entry.display { --scenario-tone: var(--amber); --scenario-wash: #fff8ed; }
    .scenario-entry.other { --scenario-tone: #7b5aa6; --scenario-wash: #f6f1fb; }
    .scenario-entry-head { display: flex; align-items: start; justify-content: space-between; gap: 14px; padding: 21px 20px 14px; }
    .scenario-entry-head h3 { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.35; letter-spacing: -.025em; }
    .scenario-kind { display: inline-flex; margin-top: 5px; color: var(--scenario-tone); font-size: 11px; font-weight: 720; }
    .scenario-status {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      min-height: 27px;
      max-width: 58%;
      padding: 3px 9px;
      border: 1px solid #cae9dc;
      border-radius: 999px;
      color: var(--success);
      background: var(--success-soft);
      text-align: right;
      font-size: 10px;
      font-weight: 760;
      line-height: 1.35;
    }
    .scenario-status.issue { color: var(--scenario-tone); background: var(--scenario-wash); }
    .scenario-entry.personnel .scenario-status.issue { border-color: #ded1eb; }
    .scenario-entry.display .scenario-status.issue { border-color: #efd8b7; }
    .scenario-entry-body { min-width: 0; padding: 0 20px 17px; }
    .scenario-overview-stats { display: grid; overflow: hidden; border: 1px solid #e0e7ea; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .scenario-overview-stat { min-width: 0; padding: 10px; border-right: 1px solid #e0e7ea; background: #fafcfc; }
    .scenario-overview-stat:last-child { border-right: 0; }
    .scenario-overview-stat span { display: block; min-height: 2.7em; color: var(--ink-soft); font-size: 10px; font-weight: 690; line-height: 1.35; }
    .scenario-overview-stat strong { display: block; margin-top: 3px; font-family: var(--font-number); font-size: 21px; font-variant-numeric: tabular-nums; line-height: 1.15; }
    .scenario-overview-stat:nth-child(1) strong { color: #33434b; }
    .scenario-overview-stat:nth-child(2) strong { color: var(--success); }
    .scenario-overview-stat:nth-child(3) strong { color: var(--danger); }
    .scenario-progress { margin-top: 14px; }
    .scenario-progress-copy { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #65747b; font-size: 10px; font-weight: 700; }
    .scenario-progress-copy strong { color: var(--scenario-tone); font-family: var(--font-number); font-size: 11px; font-variant-numeric: tabular-nums; }
    .scenario-progress-track { height: 5px; margin-top: 7px; overflow: hidden; background: #e6ecef; }
    .scenario-progress-value { display: block; width: var(--scenario-progress, 0%); height: 100%; background: var(--scenario-tone); }
    .scenario-overview-actions { display: flex; justify-content: flex-end; padding: 11px 14px; background: #f7f9fa; border-top: 1px solid #dfe6e9; }
    .enter-scenario {
      min-height: 34px;
      padding: 6px 14px;
      color: #fff;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 760;
      transition: background-color 200ms ease, border-color 200ms ease, transform 200ms ease;
    }
    .enter-scenario:hover { background: var(--accent-strong); border-color: var(--accent-strong); transform: translateY(-1px); }
    .enter-scenario:active { transform: translateY(0); }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(var(--metric-count, 4), minmax(0, 1fr));
      margin-bottom: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .metric { min-width: 0; padding: 12px 14px; border-top: 2px solid transparent; border-right: 1px solid var(--line); }
    .metric:last-child { border-right: 0; }
    .metric-label { display: block; color: var(--ink-soft); font-size: 11px; font-weight: 700; }
    .metric-value { display: block; margin-top: 3px; font-family: var(--font-number); font-size: 26px; font-weight: 760; line-height: 1.15; }
    .metric.pass .metric-value { color: var(--success); }
    .metric.issue .metric-value { color: var(--danger); }
    .metric.accent { border-top-color: var(--accent); }
    .metric.accent .metric-value { color: var(--accent-strong); }
    .metric.teal { border-top-color: var(--teal); }
    .metric.teal .metric-value { color: var(--teal); }
    .metric.pass { border-top-color: var(--success); }
    .metric.issue { border-top-color: var(--danger); }
    .metric.settlement { border-top-color: var(--purple); }
    .metric.settlement .metric-label, .metric.settlement .metric-value { color: var(--purple); }
    .summary-grid.three { --metric-count: 3; }

    .context-panels { display: grid; gap: 10px; min-width: 0; margin-bottom: 14px; }
    .business-panel { overflow: hidden; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 48px;
      padding: 10px 14px;
      background: var(--surface-soft);
      border-bottom: 1px solid var(--line);
    }
    details.business-panel > summary.panel-head {
      list-style: none;
      cursor: pointer;
      user-select: none;
    }
    details.business-panel > summary.panel-head::-webkit-details-marker { display: none; }
    details.business-panel:not([open]) > summary.panel-head { border-bottom-color: transparent; }
    details.business-panel > summary.panel-head:focus-visible {
      outline: 3px solid var(--accent-soft);
      outline-offset: -3px;
    }
    .panel-head h3 { min-width: 0; margin: 0; overflow-wrap: anywhere; font-size: 15px; font-weight: 780; }
    .panel-collapse-meta { display: inline-flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .panel-toggle {
      position: relative;
      width: 24px;
      height: 24px;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      background: var(--surface);
    }
    .panel-toggle::before, .panel-toggle::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 9px;
      height: 1.5px;
      background: var(--ink-soft);
      transform: translate(-50%, -50%);
      transition: transform 160ms ease, opacity 160ms ease;
    }
    .panel-toggle::after { transform: translate(-50%, -50%) rotate(90deg); }
    details.business-panel[open] .panel-toggle::after { opacity: 0; transform: translate(-50%, -50%) rotate(0); }
    .panel-body { min-width: 0; padding: 10px; }
    .overview-panel { border-top: 2px solid var(--amber); }
    .overview-panel .panel-head h3 { color: var(--amber); }
    .settlement-panel { border-top: 2px solid var(--purple); }
    .settlement-panel .panel-head h3 { color: var(--purple); }
    .overview-body .evidence-cell { border: 0; padding: 4px; }
    .overview-body .evidence-label { margin-bottom: 8px; }
    .settlement-stack { display: grid; gap: 8px; min-width: 0; }
    .settlement-item { overflow: hidden; min-width: 0; border: 1px solid var(--line); border-radius: var(--radius-small); }
    .settlement-item.issue { border-color: #f1caca; }
    .settlement-item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 40px;
      padding: 7px 10px;
      background: #fbfcfd;
      border-bottom: 1px solid var(--line);
    }
    .settlement-item-head h4 { min-width: 0; margin: 0; overflow-wrap: anywhere; font-size: 13px; font-weight: 760; }
    .settlement-fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 8px; }

    .list-section { min-width: 0; }
    .list-heading { display: flex; align-items: end; justify-content: space-between; gap: 12px; padding: 2px 2px 8px; }
    .list-heading h3 { margin: 0; font-size: 17px; font-weight: 780; }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 12px;
      align-items: end;
      padding: 11px;
      margin-bottom: 7px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .control-group { min-width: 0; }
    .control-label { display: block; margin: 0 0 4px; color: var(--ink-soft); font-size: 10px; font-weight: 700; }
    .search-wrap { position: relative; min-width: 0; }
    .search-input {
      width: 100%;
      height: 38px;
      padding: 0 58px 0 11px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-small);
      outline: none;
    }
    .search-input::placeholder { color: #98a2aa; }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(24, 169, 245, .1); }
    .clear-search {
      position: absolute;
      right: 4px;
      top: 4px;
      min-width: 48px;
      height: 30px;
      padding: 0 7px;
      color: var(--ink-soft);
      background: var(--surface-soft);
      border: 0;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }
    .clear-search[hidden] { display: none; }
    .segmented { display: flex; align-items: center; gap: 5px; }
    .filter-button, .tool-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 36px;
      padding: 6px 10px;
      color: var(--ink-soft);
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-small);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .filter-button:hover, .tool-button:hover { color: var(--accent-strong); border-color: var(--accent); }
    .filter-button[aria-pressed="true"] { color: #fff; background: var(--accent); border-color: var(--accent); }
    .filter-count { min-width: 18px; padding: 0 4px; background: rgba(18, 23, 28, .07); border-radius: 4px; font-family: var(--font-number); font-size: 9px; text-align: center; }
    .filter-button[aria-pressed="true"] .filter-count { background: rgba(255, 255, 255, .2); }
    .side-actions .tool-button { width: 100%; }
    .results-line { min-height: 27px; padding: 0 2px; color: var(--ink-soft); font-size: 11px; }
    .results-line strong { color: var(--ink); font-family: var(--font-number); }

    .records { display: grid; gap: 7px; min-width: 0; }
    .record-card { overflow: clip; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--line-strong); border-radius: var(--radius); }
    .record-card.pass { border-left-color: var(--success); }
    .record-card.issue { border-left-color: var(--danger); }
    .record-card > details > summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 18px;
      gap: 11px;
      align-items: center;
      min-height: 58px;
      padding: 8px 13px;
      cursor: pointer;
      list-style: none;
    }
    .record-card summary::-webkit-details-marker { display: none; }
    .record-title { min-width: 0; }
    .record-title h3 { margin: 0 0 2px; overflow-wrap: anywhere; font-size: 14px; font-weight: 760; line-height: 1.42; }
    .record-title p { display: -webkit-box; margin: 0; overflow: hidden; color: var(--ink-soft); font-size: 12px; line-height: 1.45; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
    .status-pill { display: inline-flex; align-items: center; justify-content: center; min-width: 62px; padding: 4px 8px; border: 1px solid transparent; border-radius: 999px; font-size: 10px; font-weight: 760; }
    .status-pill.pass { color: var(--success); background: var(--success-soft); border-color: #cae9dc; }
    .status-pill.issue { color: #b63838; background: var(--danger-soft); border-color: #f0cccc; }
    .status-pill.summary { color: var(--settlement); background: var(--settlement-soft); border-color: #dfd0ee; }
    .chevron { display: grid; place-items: center; color: var(--ink-faint); font-family: var(--font-number); font-size: 16px; }
    .chevron::before { content: "+"; }
    details[open] .chevron::before { content: "-"; }
    .record-body { padding: 10px; background: #fbfcfd; border-top: 1px solid var(--line); }
    .display-record > details > summary {
      grid-template-columns: minmax(0, 1fr) auto 92px 18px;
      min-height: 76px;
      padding: 11px 13px;
    }
    .display-record .record-title p { -webkit-line-clamp: 2; }
    .store-amount {
      min-width: 78px;
      padding-left: 12px;
      border-left: 1px solid var(--line);
      text-align: right;
    }
    .store-amount small { display: block; color: var(--ink-faint); font-size: 9px; font-weight: 680; }
    .store-amount strong { display: block; color: var(--purple); font-family: var(--font-number); font-size: 19px; font-weight: 780; font-variant-numeric: tabular-nums; }
    .display-reader { display: grid; gap: 9px; }
    .display-decision-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(250px, .75fr); gap: 9px; }
    .display-decision-block { min-width: 0; padding: 11px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-small); }
    .display-decision-block h4 { margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 780; }
    .display-result-block { background: #faf8fd; border-color: #e0d5ed; }
    .display-result-line { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
    .display-result-line:last-child { margin-bottom: 0; }
    .display-result-line span { color: var(--ink-soft); font-size: 11px; }
    .display-result-line strong { color: var(--ink); text-align: right; font-size: 13px; font-weight: 780; }
    .display-result-line.amount strong { color: var(--purple); font-family: var(--font-number); font-size: 19px; }
    .display-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px 12px; }
    .display-fact { min-width: 0; }
    .display-fact.wide { grid-column: 1 / -1; }
    .display-fact span { display: block; margin-bottom: 2px; color: var(--ink-faint); font-size: 9px; font-weight: 700; }
    .display-fact strong { display: block; color: #34404a; font-size: 11px; font-weight: 680; overflow-wrap: anywhere; }
    .display-product-block { padding: 11px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-small); }
    .display-product-block h4, .display-resubmit h4 { margin: 0 0 7px; font-size: 12px; font-weight: 780; }
    .display-product-block .photo-products { margin: 0; }
    .display-resubmit { padding: 11px; background: var(--danger-soft); border: 1px solid #f0cccc; border-radius: var(--radius-small); }
    .display-resubmit ul { display: grid; gap: 5px; margin: 0; padding-left: 20px; color: #7f3131; font-size: 11px; }
    .display-resubmit .no-action { margin: 0; color: var(--success); font-size: 11px; font-weight: 740; }
    .record-evidence { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-small); background: var(--surface); }
    .record-evidence > summary {
      display: flex;
      min-height: 40px;
      padding: 8px 11px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--ink-soft);
      background: var(--surface-soft);
      cursor: pointer;
      list-style: none;
      font-size: 11px;
      font-weight: 720;
    }
    .record-evidence > summary::after { color: var(--ink-faint); content: "+"; font-family: var(--font-number); font-size: 16px; }
    .record-evidence[open] > summary::after { content: "-"; }
    .record-evidence > .evidence-grid { padding: 8px; border-top: 1px solid var(--line); }
    .evidence-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .evidence-cell { min-width: 0; padding: 9px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-small); }
    .record-body .field-1, .record-body .field-2, .record-body .field-5 { grid-column: span 2; }
    .record-card.pass .conclusion-cell { background: var(--success-soft); border-color: #cae9dc; }
    .record-card.issue .conclusion-cell, .settlement-item.issue .conclusion-cell { background: var(--danger-soft); border-color: #f0cccc; }
    .evidence-label { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 7px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
    .evidence-label strong { color: var(--ink); font-size: 12px; font-weight: 760; }
    .evidence-label small { max-width: 58%; color: var(--ink-faint); font-size: 9px; overflow-wrap: anywhere; text-align: right; }
    .cell-body { min-width: 0; color: #34404a; font-size: 12px; word-break: break-word; }
    .cell-line { margin: 0 0 5px; white-space: pre-wrap; }
    .cell-line:last-child { margin-bottom: 0; }
    .cell-line b { color: var(--ink); font-weight: 720; }
    .semantic-code, .semantic-source { color: var(--accent-strong); font-family: var(--font-number); font-weight: 760; }
    .semantic-quantity { color: var(--teal); font-family: var(--font-number); font-weight: 760; }
    .semantic-pass { color: var(--success); font-weight: 760; }
    .semantic-issue { color: var(--danger); font-weight: 760; }
    .semantic-review { color: var(--amber); font-weight: 760; }
    .semantic-settlement { color: var(--purple); font-weight: 760; }
    .empty-value { color: transparent; user-select: none; }

    .photo-products, .identity-card, .knowledge-comparison { margin: 8px 0; overflow: hidden; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-small); }
    .photo-products-title, .identity-title { padding: 7px 9px; color: #007dbd; background: var(--accent-soft); border-bottom: 1px solid #ccecff; font-size: 11px; font-weight: 760; }
    .table-scroll { width: 100%; max-width: 100%; overflow-x: auto; overscroll-behavior-inline: contain; }
    .knowledge-comparison .table-scroll { overflow-x: visible; }
    .photo-product-table, .identity-table, .knowledge-comparison-table { width: 100%; border-collapse: collapse; }
    .photo-product-table { min-width: 620px; table-layout: fixed; }
    .identity-table { min-width: 360px; table-layout: fixed; }
    .knowledge-comparison-table { min-width: 0; table-layout: fixed; }
    .photo-product-table th, .photo-product-table td, .identity-table th, .identity-table td,
    .knowledge-comparison-table th, .knowledge-comparison-table td { padding: 6px 8px; vertical-align: top; text-align: left; border-bottom: 1px solid var(--line); }
    .photo-product-table tr:last-child td, .identity-table tr:last-child th, .identity-table tr:last-child td { border-bottom: 0; }
    .photo-product-table thead th { color: var(--ink-soft); background: var(--surface-soft); font-size: 10px; font-weight: 700; white-space: nowrap; }
    .photo-product-table td { color: var(--ink); font-size: 11px; font-weight: 650; }
    .photo-product-table th:nth-child(1) { width: 48%; }
    .photo-product-table th:nth-child(2) { width: 20%; }
    .photo-product-table th:nth-child(3) { width: 20%; }
    .photo-product-table th:nth-child(4) { width: 12%; }
    .identity-table th { width: 76px; color: var(--ink-soft); background: var(--surface-soft); font-weight: 650; white-space: nowrap; }
    .identity-table td { color: var(--ink); font-weight: 650; }
    .knowledge-comparison-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 7px 9px; color: #007dbd; background: var(--accent-soft); border-bottom: 1px solid #ccecff; font-size: 11px; font-weight: 760; }
    .knowledge-comparison-head small { max-width: 54%; font-size: 9px; overflow-wrap: anywhere; text-align: right; }
    .knowledge-comparison-table thead th { color: var(--ink-soft); background: var(--surface-soft); font-size: 10px; font-weight: 700; }
    .knowledge-comparison-table tbody th { color: var(--ink); font-size: 11px; font-weight: 760; }
    .knowledge-comparison-table th, .knowledge-comparison-table td { overflow-wrap: anywhere; }
    .knowledge-comparison-table td { color: var(--ink); font-size: 11px; font-weight: 650; }
    .knowledge-comparison-table tr:last-child th, .knowledge-comparison-table tr:last-child td { border-bottom: 0; }
    .knowledge-comparison-table th:nth-child(1) { width: 11%; }
    .knowledge-comparison-table th:nth-child(2) { width: 27%; }
    .knowledge-comparison-table th:nth-child(3) { width: 16%; }
    .knowledge-comparison-table th:nth-child(4) { width: 16%; }
    .knowledge-comparison-table th:nth-child(5) { width: 13%; }
    .knowledge-comparison-table th:nth-child(6) { width: 17%; }
    .knowledge-calculation { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 34px; padding: 6px 9px; color: var(--ink-soft); background: #faf8fd; border-top: 1px solid var(--line); font-size: 10px; font-weight: 700; }
    .knowledge-calculation strong { color: var(--purple); font-family: var(--font-number); font-size: 12px; font-weight: 780; }
    .identity-spacer { height: 2px; }

    .empty-state { padding: 42px 20px; text-align: center; background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--radius); }
    .empty-state strong { display: block; margin-bottom: 3px; font-size: 15px; }
    .empty-state span { color: var(--ink-soft); font-size: 11px; }
    .back-top { position: fixed; right: 18px; bottom: 18px; min-width: 70px; height: 36px; padding: 0 10px; color: #fff; background: #11171c; border: 1px solid #11171c; border-radius: var(--radius-small); cursor: pointer; font-size: 11px; font-weight: 700; opacity: 0; pointer-events: none; transform: translateY(5px); transition: opacity .15s ease, transform .15s ease; }
    .back-top.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }

    @media (max-width: 1100px) {
      .app-shell, .topbar-inner { width: min(100% - 28px, 1600px); }
      .app-shell { grid-template-columns: 210px minmax(0, 1fr); gap: 14px; }
      .home-cockpit { grid-template-columns: minmax(240px, .8fr) minmax(520px, 1.8fr); }
      .evidence-grid, .settlement-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 780px) {
      .topbar-inner, .app-shell { width: min(100% - 20px, 1600px); }
      .topbar-inner { min-height: 56px; }
      .app-shell { grid-template-columns: 1fr; margin-top: 10px; }
      .side-panel { position: relative; top: 0; }
      .side-heading { display: none; }
      .scenario-tabs { grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); padding: 6px; border-bottom: 1px solid var(--line); }
      .side-actions { padding: 6px; }
      .workspace-head { min-height: 50px; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .home-view { min-height: auto; }
      .home-cockpit { min-height: 0; grid-template-columns: 1fr; }
      .home-cockpit-intro { min-height: 112px; padding: 20px 22px; border-right: 0; border-bottom: 1px solid rgba(171, 186, 193, .56); }
      .home-title-lockup h2 { font-size: 28px; }
      .home-state { margin-top: 11px; }
      .home-summary-grid { min-height: 88px; }
      .home-overview-metric { min-height: 88px; padding: 16px; }
      .home-overview-metric strong { margin-top: 5px; font-size: 32px; }
      .scenario-overview-grid { grid-template-columns: 1fr; }
      .summary-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .metric { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
      .metric:nth-child(2n) { border-right: 0; }
      .metric:nth-last-child(-n + 2) { border-bottom: 0; }
      .toolbar { grid-template-columns: 1fr; }
      .evidence-grid, .settlement-fields { grid-template-columns: 1fr; }
      .record-body .evidence-cell { grid-column: auto; }
      .display-decision-grid { grid-template-columns: 1fr; }
      .knowledge-comparison-head { align-items: flex-start; flex-direction: column; gap: 2px; }
      .knowledge-comparison-head small { max-width: 100%; text-align: left; }
      .knowledge-comparison-table, .knowledge-comparison-table tbody { display: block; }
      .knowledge-comparison-table thead { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      .knowledge-comparison-table tbody tr { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
      .knowledge-comparison-table tbody tr:last-child { border-bottom: 0; }
      .knowledge-comparison-table tbody th, .knowledge-comparison-table tbody td { display: block; min-width: 0; padding: 7px 8px; border: 0; }
      .knowledge-comparison-table tbody tr > th:nth-child(n), .knowledge-comparison-table tbody tr > td:nth-child(n) { width: 100%; }
      .knowledge-comparison-table tbody th::before, .knowledge-comparison-table tbody td::before { content: attr(data-label); display: block; margin-bottom: 2px; color: var(--ink-soft); font-size: 9px; font-weight: 650; }
      .knowledge-comparison-table td.empty-value { display: none; }
    }
    @media (max-width: 520px) {
      .brand-mark strong { font-size: 24px; }
      h1 { font-size: 15px; }
      .top-divider { display: none; }
      .app-shell { gap: 9px; }
      .workspace-head { padding-bottom: 8px; }
      .workspace-head h2 { font-size: 19px; }
      .home-view { padding: 10px; }
      .home-cockpit { margin-bottom: 13px; clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 10px 100%, 0 calc(100% - 10px)); }
      .home-cockpit-intro { min-height: 94px; padding: 16px; }
      .home-cockpit-intro::after { right: 16px; bottom: 13px; }
      .home-title-lockup h2 { font-size: 25px; }
      .home-state { margin-top: 9px; }
      .home-summary-grid { min-height: 72px; }
      .home-overview-metric { min-height: 72px; padding: 11px 9px; }
      .home-overview-metric span { font-size: 10px; }
      .home-overview-metric strong { font-size: 27px; }
      .home-section-head { min-height: 36px; padding-bottom: 7px; }
      .scenario-entry-head { padding: 17px 14px 11px; }
      .scenario-entry-head h3 { font-size: 16px; }
      .scenario-status { max-width: 62%; font-size: 9px; }
      .scenario-entry-body { padding: 0 14px 13px; }
      .scenario-overview-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .scenario-overview-stat span { min-height: auto; }
      .scenario-overview-actions { padding: 9px 12px; }
      .metric { min-height: 69px; padding: 9px; }
      .metric-value { font-size: 22px; }
      .panel-head { min-height: 42px; padding: 8px 10px; }
      .panel-body { padding: 7px; }
      .settlement-fields { padding: 6px; gap: 6px; }
      .segmented { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .filter-button { width: 100%; padding-inline: 5px; }
      .record-card > details > summary { grid-template-columns: minmax(0, 1fr) 16px; gap: 7px; padding: 9px 10px; }
      .status-pill { grid-column: 1; justify-self: start; }
      .chevron { grid-column: 2; grid-row: 1 / span 2; }
      .display-record > details > summary { grid-template-columns: minmax(0, 1fr) auto 16px; }
      .display-record .status-pill { grid-column: 2; grid-row: 1; align-self: start; }
      .display-record .store-amount { grid-column: 1; grid-row: 2; padding: 0; border-left: 0; text-align: left; }
      .display-record .chevron { grid-column: 3; grid-row: 1 / span 2; }
      .display-facts { grid-template-columns: 1fr; }
      .display-fact.wide { grid-column: auto; }
      .record-body { padding: 7px; }
      .evidence-label { align-items: flex-start; flex-direction: column; }
      .evidence-label small { max-width: 100%; text-align: left; }
      .knowledge-comparison-table tbody tr { grid-template-columns: 1fr; }
      .back-top { right: 10px; bottom: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="topSentinel" aria-hidden="true"></div>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-mark" aria-label="参半 CANBAN"><strong>参半</strong><small>CANBAN</small></div>
      <span class="top-divider" aria-hidden="true"></span>
      <div class="product-lockup"><h1>渠道活动核销</h1></div>
    </div>
  </header>

  <main class="app-shell" id="top">
    <aside class="side-panel" aria-label="核销工作台">
      <div class="side-heading"><strong>核销工作台</strong></div>
      <nav class="scenario-tabs" id="scenarioTabs" aria-label="核销工作台"></nav>
      <div class="side-actions" id="sideActions" hidden>
        <button class="tool-button" id="expandButton" type="button" aria-pressed="false">展开全部</button>
      </div>
    </aside>

    <div class="workspace-stack">
      <section class="home-view" id="homeView" aria-label="核销总览">
        <section class="home-cockpit" aria-labelledby="homeTitle">
          <header class="home-cockpit-intro">
            <div class="home-title-lockup">
              <h2 id="homeTitle">核销总览</h2>
              <div class="home-state" id="homeOverallStatus">核销状态</div>
            </div>
          </header>
          <section class="home-summary-grid" id="homeSummaryGrid" aria-label="整体业务统计"></section>
        </section>
        <section class="home-scenarios" aria-labelledby="homeScenarioTitle">
          <div class="home-section-head"><h3 id="homeScenarioTitle">核销场景</h3></div>
          <section class="scenario-overview-grid" id="scenarioOverview" aria-label="场景概览"></section>
        </section>
      </section>

      <section class="workspace" id="scenarioView" aria-label="核销结果" hidden>
        <header class="workspace-head">
          <h2 id="sheetTitle"></h2>
        </header>

        <section class="summary-grid" id="summaryGrid" aria-label="业务统计"></section>
        <section class="context-panels" id="contextPanels" aria-label="业务汇总"></section>

        <section class="list-section">
          <div class="list-heading"><h3 id="listTitle"></h3></div>
          <section class="toolbar" aria-label="查找与筛选">
            <div class="control-group">
              <label class="control-label" id="searchLabel" for="searchInput">搜索核验记录</label>
              <div class="search-wrap">
                <input class="search-input" id="searchInput" type="search" autocomplete="off">
                <button class="clear-search" id="clearSearch" type="button" aria-label="清空搜索" hidden>清空</button>
              </div>
            </div>
            <div class="control-group">
              <span class="control-label">核验结论</span>
              <div class="segmented" id="statusFilters" aria-label="结论筛选">
                <button class="filter-button" type="button" data-status="all" data-label="全部" aria-pressed="true">全部</button>
                <button class="filter-button" type="button" data-status="pass" data-label="只看通过" aria-pressed="false">只看通过</button>
                <button class="filter-button" type="button" data-status="issue" data-label="只看待补" aria-pressed="false">只看待补</button>
              </div>
            </div>
          </section>

          <div class="results-line"><span id="resultsCount" aria-live="polite"></span></div>
          <section class="records" id="records"></section>
        </section>
      </section>
    </div>

          ['customer_name', '客户名称'],
          ['business_date', '业务日期'],
          ['product_code', '商品编码'],
          ['product_name', '商品名称'],
          ['retail_price', '零售价'],
          ['total_amount', '合计金额'],
          ['quantity', '数量'],
          ['不一致或无法核对字段：', '需要核对：'],
        ];
        replacements.forEach(([source, target]) => { text = text.split(source).join(target); });
        const knowledgeMarker = '合同商品对应知识库：';
        const markerIndex = text.indexOf(knowledgeMarker);
        if (markerIndex >= 0) {
          const prefix = text.slice(0, markerIndex);
          const knowledgeFields = [];
          const salesFields = [];
          text.slice(markerIndex).split('、').forEach((part) => {
            if (part.startsWith(knowledgeMarker)) knowledgeFields.push(part.slice(knowledgeMarker.length));
            else if (part) salesFields.push(part);
          });
          const groups = [];
          if (knowledgeFields.length) groups.push(`合同商品与知识库：${[...new Set(knowledgeFields)].join('、')}`);
          if (salesFields.length) groups.push(`合同附件与销售Excel：${[...new Set(salesFields)].join('、')}`);
          if (groups.length) text = prefix + groups.join('；');
        }
        return text;
      };

      const renderSemanticText = (value, defaultClass = '') => {
        const raw = humanizeVisibleText(value);
        const pieces = [];
        let cursor = 0;
        semanticTokenPattern.lastIndex = 0;
        let match;
        while ((match = semanticTokenPattern.exec(raw)) !== null) {
          if (match.index > cursor) {
            const plain = escapeHtml(raw.slice(cursor, match.index));
            pieces.push(defaultClass ? `<span class="${defaultClass}">${plain}</span>` : plain);
          }
          const tokenClass = semanticTokenClass(match[0]) || defaultClass;
          const token = escapeHtml(match[0]);
          pieces.push(tokenClass ? `<span class="${tokenClass}">${token}</span>` : token);
          cursor = match.index + match[0].length;
        }
        if (cursor < raw.length) {
          const plain = escapeHtml(raw.slice(cursor));
          pieces.push(defaultClass ? `<span class="${defaultClass}">${plain}</span>` : plain);
        }
        return pieces.join('');
      };

      const renderLine = (line) => {
        const raw = String(line || '');
        const colon = raw.indexOf('：');
        if (colon > 0 && colon <= 18) {
          const label = raw.slice(0, colon + 1);
          const value = raw.slice(colon + 1);
          return `<p class="cell-line"><b>${escapeHtml(label)}</b>${renderSemanticText(value, semanticLabelClass(label))}</p>`;
        }
        return `<p class="cell-line">${renderSemanticText(raw) || '&nbsp;'}</p>`;
      };

      const renderPhotoProducts = (line) => {
        const raw = String(line || '');
        if (!raw.startsWith('现场商品：')) return '';
        const content = raw.slice('现场商品：'.length).trim();
        const pattern = /(.+?)（(CP-[A-Z0-9-]+)\s*\/\s*(\d{13})\s*，\s*置信度：\s*(高|中|低)）(?:、|$)/g;
        const products = [];
        let consumed = 0;
        let match;
        while ((match = pattern.exec(content)) !== null) {
          if (match.index !== consumed) return '';
          const name = match[1].replace(/^、\s*/, '').trim();
          if (!name || name.includes('）、')) return '';
          products.push({ name, code: match[2], barcode: match[3], confidence: match[4] });
          consumed = match.index + match[0].length;
        }
        if (!products.length || consumed !== content.length) return '';
        const body = products.map((product) => `<tr>
          <td>${escapeHtml(product.name)}</td><td class="semantic-code">${escapeHtml(product.code)}</td>
          <td class="semantic-code">${escapeHtml(product.barcode)}</td><td class="${product.confidence === '高' ? 'semantic-pass' : product.confidence === '低' ? 'semantic-issue' : 'semantic-review'}">${escapeHtml(product.confidence)}</td>
        </tr>`).join('');
        return `<section class="photo-products"><div class="photo-products-title">现场商品</div>
          <div class="table-scroll"><table class="photo-product-table" data-photo-products="true">
            <thead><tr><th>商品名称</th><th>商品编码</th><th>69码</th><th>置信度</th></tr></thead>
            <tbody>${body}</tbody>
          </table></div>
        </section>`;
      };

      const renderPersonnelKnowledgeComparison = (value, header) => {
        const meta = splitHeader(header);
        if (meta.label !== '销售Excel + 商品知识库（代码核验）') return '';
        const lines = String(value || '').split('\n');
        if (lines.length !== 6 || lines.some((line) => !line.trim())) return '';
        const excelProduct = lines[0].match(/^Excel商品：(.*)$/);
        const barcodeQuantity = lines[1].match(/^条码：(.*?)；数量：(.*)$/);
        const knowledgeProduct = lines[2].match(/^知识库商品：(CP-[A-Z0-9-]+)\s*\/\s*(.*?)\s*\/\s*(\d{13})$/);
        const knowledgeMissing = lines[2] === '知识库商品：未确认';
        const matchText = /^(69码[^；]+)；(产品名.+)$/.test(lines[3]) ? lines[3] : '';
        const confidence = lines[4].match(/^知识库结论：置信度：(高|中|低)$/);
        const reward = lines[5].match(/^计算奖励：(.*元)$/);
        if (!excelProduct || !barcodeQuantity || (!knowledgeProduct && !knowledgeMissing) || !matchText || !confidence || !reward) return '';

        const knowledgeName = knowledgeProduct ? knowledgeProduct[2] : '未确认';
        const knowledgeCode = knowledgeProduct ? knowledgeProduct[1] : '';
        const knowledgeBarcode = knowledgeProduct ? knowledgeProduct[3] : '';
        const confidenceClass = confidence[1] === '高' ? 'semantic-pass' : confidence[1] === '低' ? 'semantic-issue' : 'semantic-review';
        return `<section class="knowledge-comparison" data-knowledge-comparison="true">
          <div class="knowledge-comparison-head"><span>销售Excel + 商品知识库（代码核验）</span>${meta.source ? `<small class="semantic-source">${escapeHtml(meta.source)}</small>` : ''}</div>
          <div class="table-scroll"><table class="knowledge-comparison-table">
            <thead><tr><th>来源</th><th>商品名称</th><th>商品编码</th><th>69码</th><th>数量</th><th>匹配结果</th></tr></thead>
            <tbody>
              <tr><th scope="row" data-label="来源">销售Excel</th><td data-label="商品名称">Excel商品：${escapeHtml(excelProduct[1])}</td><td data-label="商品编码">&nbsp;</td><td data-label="69码" class="semantic-code">条码：${escapeHtml(barcodeQuantity[1])}</td><td data-label="数量" class="semantic-quantity">数量：${escapeHtml(barcodeQuantity[2])}</td><td data-label="匹配结果">${renderSemanticText(matchText)}</td></tr>
              <tr><th scope="row" data-label="来源">商品知识库</th><td data-label="商品名称">知识库商品：${escapeHtml(knowledgeName)}</td><td data-label="商品编码" class="semantic-code">${knowledgeCode ? `商品编码：${escapeHtml(knowledgeCode)}` : '&nbsp;'}</td><td data-label="69码" class="semantic-code">${knowledgeBarcode ? `69码：${escapeHtml(knowledgeBarcode)}` : '&nbsp;'}</td><td data-label="数量" class="empty-value">&nbsp;</td><td data-label="匹配结果" class="${confidenceClass}">知识库结论：置信度：${escapeHtml(confidence[1])}</td></tr>
            </tbody>
          </table></div>
          <div class="knowledge-calculation"><span>核销计算</span><strong>计算奖励：${escapeHtml(reward[1])}</strong></div>
        </section>`;
      };

      const renderPersonnelComparisonSummary = (value, header) => {
        const meta = splitHeader(header);
        if (meta.label !== '具体对比结果') return '';
        const lines = String(value || '').split('\n');
        if (
          lines.length !== 5 ||
          lines[0] !== 'Excel ↔ 商品知识库' ||
          lines[2] !== '销售/知识库 ↔ 结算单'
        ) return '';
        const confidence = lines[3].match(/^商品：置信度：(高|中|低)$/);
        const differences = lines[4].match(/^数量差：(.*?)；金额差：(.*?)元$/);
        if (!confidence || !differences) return '';

        const knowledgeResult = lines[1]
          .replace('69码精确匹配', '69码一致')
          .replace('69码完全不匹配', '69码不一致')
          .replace('产品名精确匹配', '商品名称一致')
          .replace('产品名模糊匹配', '商品名称对应')
          .replace('产品名完全不匹配', '商品名称无法对应');
        const mappingResult = confidence[1] === '高'
          ? '商品对应（置信度：高）'
          : confidence[1] === '中'
            ? '商品对应（置信度：中）'
            : '商品无法确认（置信度：低）';
        const isZero = (raw) => /^[-+]?0(?:\.0+)?$/.test(String(raw).trim());
        const quantityResult = isZero(differences[1])
          ? '数量一致'
          : `数量不一致（相差${differences[1]}）`;
        const amountResult = isZero(differences[2])
          ? '奖励金额一致'
          : `奖励金额不一致（相差${differences[2]}元）`;
        const settlementResult = confidence[1] !== '低' && isZero(differences[1]) && isZero(differences[2])
          ? `商品、数量、奖励金额全部对应（置信度：${confidence[1]}）`
          : `${mappingResult}；${quantityResult}；${amountResult}`;
        return `<div class="personnel-comparison-summary" data-personnel-comparison="true">
          <p class="cell-line"><b>Excel商品与知识库：</b>${renderSemanticText(knowledgeResult)}</p>
          <p class="cell-line"><b>结算单与销售记录：</b>${renderSemanticText(settlementResult)}</p>
        </div>`;
      };

      const renderCellBody = (value, header) => {
        const personnelTable = renderPersonnelKnowledgeComparison(value, header);
        if (personnelTable) return personnelTable;
        const personnelComparison = renderPersonnelComparisonSummary(value, header);
        if (personnelComparison) return personnelComparison;
        const lines = String(value || '').split('\n');
        const identityHeading = /^(现场商品\d+（知识库）|对应销售Excel第\d+行)$/;
        const identityField = /^(商品编码|商品名称|69码|数量)：(.*)$/;
        const blocks = [];
        let index = 0;
        while (index < lines.length) {
          const productTable = renderPhotoProducts(lines[index]);
          if (productTable) {
            blocks.push(productTable);
            index += 1;
            continue;
          }
          const heading = lines[index].match(identityHeading);
          if (heading) {
            const rows = [];
            index += 1;
            while (index < lines.length) {
              const field = lines[index].match(identityField);
              if (!field) break;
              rows.push(`<tr><th scope="row">${escapeHtml(field[1])}</th><td>${renderSemanticText(field[2], semanticLabelClass(field[1])) || '&nbsp;'}</td></tr>`);
              index += 1;
            }
            if (rows.length) {
              blocks.push(`<section class="identity-card"><div class="identity-title">${escapeHtml(heading[1])}</div>
                <div class="table-scroll"><table class="identity-table"><tbody>${rows.join('')}</tbody></table></div>
              </section>`);
              continue;
            }
          }
          if (!lines[index]) {
            blocks.push('<div class="identity-spacer" aria-hidden="true"></div>');
          } else {
            blocks.push(renderLine(lines[index]));
          }
          index += 1;
        }
        return blocks.join('');
      };

      const renderCell = (header, value, cellIndex) => {
        const meta = splitHeader(header);
        const body = value ? renderCellBody(value, header) : '<span class="empty-value">&nbsp;</span>';
        const emphasis = cellIndex === 5 ? ' conclusion-cell' : '';
        return `<section class="evidence-cell field-${cellIndex}${emphasis}">
          <div class="evidence-label"><strong>${escapeHtml(meta.label)}</strong>${meta.source ? `<small class="semantic-source" title="${escapeHtml(meta.source)}">${escapeHtml(meta.source)}</small>` : ''}</div>
          <div class="cell-body">${body}</div>
        </section>`;
      };

      const renderEvidence = (sheet, row, nonEmptyOnly = false) => row.values
        .map((value, cellIndex) => ({ value, cellIndex }))
        .filter((item) => !nonEmptyOnly || item.value)
        .map((item) => renderCell(sheet.headers[item.cellIndex], item.value, item.cellIndex))
        .join('');

      const detailRows = (sheet) => sheet.rows.filter((row) => row.section === 'detail');
      const overviewRows = (sheet) => sheet.rows.filter((row) => row.section === 'overview');
      const settlementRows = (sheet) => sheet.rows.filter((row) => row.section === 'settlement');
      const activeSheet = () => data.sheets[state.sheetIndex];
      const statusText = (row) => {
        if (row.section !== 'detail') return row.status === 'issue' ? '待补资料' : '已对齐';
        return row.status === 'pass' ? '通过' : '待补资料';
      };

      const conclusionExcerpt = (row) => {
        const conclusion = row.values[5] || row.values.find(Boolean) || '';
        const lines = conclusion.split('\n').map((line) => line.trim()).filter(Boolean);
        const priority = lines.filter((line) => line.startsWith('结论：') || line.startsWith('主要问题：') || line.startsWith('置信度：'));
        if (priority.length >= 2) return priority.slice(0, 2).join('；');
        if (priority.length === 1) {
          const next = lines.find((line) => line !== priority[0] && line !== '要重新提交：');
          return [priority[0], next].filter(Boolean).join('；');
        }
        return lines.slice(0, 2).join('；');
      };

      const linesOf = (value) => String(value || '').split('\n').map((line) => line.trim()).filter(Boolean);
      const prefixedLine = (value, prefix) => linesOf(value).find((line) => line.startsWith(prefix)) || '';
      const withoutPrefix = (value, prefix) => value.startsWith(prefix) ? value.slice(prefix.length).trim() : value;
      const resubmissionLines = (value) => {
        const lines = linesOf(value);
        const marker = lines.indexOf('要重新提交：');
        return marker >= 0 ? lines.slice(marker + 1).filter((line) => /^\d+\./.test(line)) : [];
      };
      const displayRecordProjection = (row) => {
        const photo = row.values[1] || '';
        const conclusion = row.values[5] || '';
        const amount = row.values[4] || '';
        return {
          product: prefixedLine(photo, '现场商品：') || '现场商品：未确认',
          conclusion: prefixedLine(conclusion, '结论：') || (row.status === 'pass' ? '结论：可以核销' : '结论：暂不能核销'),
          amount: prefixedLine(amount, '本店支持：') || '本店支持：未确定',
          file: prefixedLine(photo, '文件：'),
          date: prefixedLine(photo, '识别日期：'),
          location: prefixedLine(photo, '识别地点：'),
          display: prefixedLine(photo, '陈列标准核验：'),
          reuse: prefixedLine(photo, '照片复用检查：'),
          promotion: prefixedLine(photo, '促销信息：'),
          resubmissions: resubmissionLines(conclusion),
        };
      };

      const renderDisplayFact = (label, line, prefix, wide = false) => line ? `
        <div class="display-fact ${wide ? 'wide' : ''}"><span>${escapeHtml(label)}</span><strong>${renderSemanticText(withoutPrefix(line, prefix))}</strong></div>` : '';

      const renderDisplayReader = (sheet, row) => {
        const fact = displayRecordProjection(row);
        const productTable = renderPhotoProducts(fact.product);
        const resubmissions = fact.resubmissions.length
          ? `<ul>${fact.resubmissions.map((line) => `<li>${renderSemanticText(line.replace(/^\d+\.\s*/, ''))}</li>`).join('')}</ul>`
          : '<p class="no-action">无需重新提交</p>';
        return `<div class="display-reader" data-display-reader="true">
          <div class="display-decision-grid">
            <section class="display-decision-block"><h4>现场确认</h4><div class="display-facts">
              ${renderDisplayFact('识别日期', fact.date, '识别日期：')}
              ${renderDisplayFact('陈列', fact.display, '陈列标准核验：')}
              ${renderDisplayFact('识别地点', fact.location, '识别地点：', true)}
              ${renderDisplayFact('照片复用', fact.reuse, '照片复用检查：')}
              ${renderDisplayFact('促销', fact.promotion, '促销信息：')}
              ${renderDisplayFact('照片文件', fact.file, '文件：', true)}
            </div></section>
            <section class="display-decision-block display-result-block"><h4>本店结果</h4>
              <div class="display-result-line"><span>结论</span><strong class="${row.status === 'pass' ? 'semantic-pass' : 'semantic-issue'}">${renderSemanticText(withoutPrefix(fact.conclusion, '结论：'))}</strong></div>
              <div class="display-result-line amount"><span>可核销金额</span><strong>${renderSemanticText(withoutPrefix(fact.amount, '本店支持：'))}</strong></div>
            </section>
          </div>
          <section class="display-product-block"><h4>现场商品</h4>${productTable || renderLine(fact.product)}</section>
          <section class="display-resubmit"><h4>需要补什么</h4>${resubmissions}</section>
          <details class="record-evidence" data-evidence-detail="true">
            <summary>查看合同、照片与销售材料</summary>
            <div class="evidence-grid">${renderEvidence(sheet, row)}</div>
          </details>
        </div>`;
      };

      const currentRows = () => {
        const query = state.query.trim().toLocaleLowerCase('zh-CN');
        return detailRows(activeSheet()).filter((row) => {
          if ((state.status === 'pass' || state.status === 'issue') && row.status !== state.status) return false;
          if (!query) return true;
          return [row.heading, ...row.values].join('\n').toLocaleLowerCase('zh-CN').includes(query);
        });
      };

      const scenarioFacts = (sheet) => {
        const details = detailRows(sheet);
        const overviews = overviewRows(sheet);
        const settlements = settlementRows(sheet);
        return {
          total: details.length,
          passed: details.filter((row) => row.status === 'pass').length,
          issues: details.filter((row) => row.status === 'issue').length,
          overviewIssues: overviews.filter((row) => row.status === 'issue').length,
          settlementIssues: settlements.filter((row) => row.status === 'issue').length,
        };
      };

      const renderNavigation = () => {
        const homeSelected = state.view === 'home';
        const scenarioButtons = data.sheets.map((sheet, index) => `
          <button class="tab-button" id="scenarioTab${index}" type="button" data-sheet="${index}" aria-controls="scenarioView" aria-selected="${!homeSelected && index === state.sheetIndex}">
            <span>${escapeHtml(sheet.name)}</span><small>${detailRows(sheet).length}项</small>
          </button>`).join('');
        tabs.innerHTML = `<button class="tab-button" id="homeButton" type="button" data-view="home" aria-controls="homeView" aria-selected="${homeSelected}">
          <span>核销总览</span><small>${data.sheets.length}类</small>
        </button>${scenarioButtons}`;
      };

      const renderHome = () => {
        const summaries = data.sheets.map((sheet) => ({ sheet, facts: scenarioFacts(sheet) }));
        const totals = summaries.reduce((result, item) => ({
          objects: result.objects + item.facts.total,
          passed: result.passed + item.facts.passed,
          detailIssues: result.detailIssues + item.facts.issues,
          hasContextIssue: result.hasContextIssue || item.facts.overviewIssues > 0 || item.facts.settlementIssues > 0,
        }), { objects: 0, passed: 0, detailIssues: 0, hasContextIssue: false });
        const metrics = [
          ['核销场景', data.sheets.length, 'accent'],
          ['核验对象', totals.objects, ''],
          ['通过', totals.passed, 'pass'],
          ['待补对象', totals.detailIssues, 'issue'],
        ];
        const overallStatus = document.getElementById('homeOverallStatus');
        const hasIssue = totals.detailIssues > 0 || totals.hasContextIssue;
        overallStatus.textContent = hasIssue ? '有材料需要处理' : '全部已通过';
        overallStatus.classList.toggle('issue', hasIssue);
        homeSummaryGrid.innerHTML = metrics.map(([label, value, tone]) => `
          <div class="home-overview-metric ${tone}"><span>${label}</span><strong>${value}</strong></div>`).join('');
        scenarioOverview.innerHTML = summaries.map(({ sheet, facts }, index) => {
          const personnel = sheet.scenario === 'personnel_incentive';
          const poster = sheet.scenario === 'poster_material';
          const other = sheet.scenario === 'other_expense';
          const errorOnly = poster || other;
          const summaryIssues = facts.overviewIssues + facts.settlementIssues;
          const hasIssue = facts.issues > 0 || summaryIssues > 0;
          const objectName = personnel ? '商品' : (errorOnly ? '错误项' : '门店');
          const objectStatus = facts.issues > 0
            ? `${objectName}${errorOnly ? '' : '待补'} ${facts.issues}`
            : `${objectName}${errorOnly ? '为零' : '已通过'}`;
          const contextStatus = summaryIssues > 0 ? `${personnel ? '结算资料' : '活动资料'}待处理` : '';
          const statusLabel = hasIssue ? [objectStatus, contextStatus].filter(Boolean).join('；') : '已对齐';
          const progress = facts.total > 0 ? Math.max(0, Math.min(100, Math.round((facts.passed / facts.total) * 100))) : 0;
          return `<article class="scenario-entry ${personnel ? 'personnel' : (other ? 'other' : 'display')}" data-home-scenario="${escapeHtml(sheet.scenario)}">
            <header class="scenario-entry-head">
              <div><h3>${escapeHtml(sheet.name)}</h3><span class="scenario-kind">${personnel ? '商品核验' : (other ? '特殊审批' : (poster ? '错误清单' : '门店核验'))}</span></div>
              <span class="scenario-status ${hasIssue ? 'issue' : ''}">${statusLabel}</span>
            </header>
            <div class="scenario-entry-body">
              <div class="scenario-overview-stats">
                <div class="scenario-overview-stat"><span>核验对象</span><strong>${facts.total}</strong></div>
                <div class="scenario-overview-stat"><span>通过</span><strong>${facts.passed}</strong></div>
                <div class="scenario-overview-stat"><span>${personnel ? '商品待补' : (errorOnly ? '错误/人工项' : '门店待补')}</span><strong>${facts.issues}</strong></div>
              </div>
              <div class="scenario-progress" aria-label="通过进度 ${progress}%">
                <div class="scenario-progress-copy"><span>通过进度</span><strong>${facts.passed} / ${facts.total}</strong></div>
                <div class="scenario-progress-track"><span class="scenario-progress-value" style="--scenario-progress:${progress}%"></span></div>
              </div>
            </div>
            <div class="scenario-overview-actions">
              <button class="enter-scenario" type="button" data-enter-sheet="${index}">进入${escapeHtml(sheet.name)}</button>
            </div>
          </article>`;
        }).join('');
      };

      const renderIntro = () => {
        const sheet = activeSheet();
        const personnel = sheet.scenario === 'personnel_incentive';
        const poster = sheet.scenario === 'poster_material';
        const other = sheet.scenario === 'other_expense';
        const errorOnly = poster || other;
        document.getElementById('sheetTitle').textContent = sheet.title;
        document.getElementById('listTitle').textContent = personnel ? '商品核验' : (other ? '分类与特殊审批' : (poster ? '错误清单' : '门店核验'));
        document.getElementById('searchLabel').textContent = personnel ? '搜索商品核验' : (errorOnly ? '搜索问题清单' : '搜索门店核验');
        searchInput.placeholder = personnel
          ? '输入商品名称、商品编码、69码或待补问题'
          : (errorOnly ? '输入错误、文件名、识别内容、审批或处理要求' : '输入门店、商品、69码、文件名或待补问题');
      };

      const renderMetrics = () => {
        const sheet = activeSheet();
        const details = detailRows(sheet);
        const settlements = settlementRows(sheet);
        const personnel = sheet.scenario === 'personnel_incentive';
        const poster = sheet.scenario === 'poster_material';
        const other = sheet.scenario === 'other_expense';
        const errorOnly = poster || other;
        const itemName = personnel ? '商品' : (errorOnly ? '错误/人工项' : '门店');
        const metrics = [
          [errorOnly ? itemName : `${itemName}核验`, details.length, 'accent', 'detail'],
          [errorOnly ? '已解决' : `${itemName}通过`, details.filter((row) => row.status === 'pass').length, 'pass', 'detail'],
          [errorOnly ? '待处理' : `${itemName}待补`, details.filter((row) => row.status === 'issue').length, 'issue', 'detail'],
        ];
        if (personnel) metrics.push(['结算待补', settlements.filter((row) => row.status === 'issue').length, 'settlement', 'settlement']);
        const grid = document.getElementById('summaryGrid');
        grid.classList.toggle('three', !personnel);
        grid.innerHTML = metrics.map(([label, value, tone, dimension]) => `
          <article class="metric ${tone}" data-dimension="${dimension}"><span class="metric-label">${label}</span>
            <strong class="metric-value">${value}</strong></article>`).join('');
      };

      const renderSummaryItems = (sheet, rows, section) => rows.map((row) => `
        <article class="settlement-item ${row.status}" data-section="${section}">
          <header class="settlement-item-head"><h4>${escapeHtml(row.heading)}</h4>
            <span class="status-pill ${row.status}">${statusText(row)}</span></header>
          <div class="settlement-fields">${renderEvidence(sheet, row, true)}</div>
        </article>`).join('');

      const renderContextPanel = (sheet, title, tone, section, rows) => {
        if (!rows.length) return '';
        const statusRows = rows.length > 1 && rows[0].heading === title ? rows.slice(1) : rows;
        const issueCount = statusRows.filter((row) => row.status === 'issue').length;
        const status = issueCount > 0 ? 'issue' : 'pass';
        const statusLabel = issueCount > 0
          ? (sheet.scenario === 'promotional_display' ? '需要处理' : `待补 ${issueCount}项`)
          : '已对齐';
        return `<details class="business-panel ${tone}-panel" data-business-section="${section}" data-collapsible-panel="true">
          <summary class="panel-head"><h3>${escapeHtml(title)}</h3>
            <span class="panel-collapse-meta"><span class="status-pill ${status}">${statusLabel}</span><span class="panel-toggle" aria-hidden="true"></span></span>
          </summary>
          <div class="panel-body"><div class="settlement-stack">${renderSummaryItems(sheet, rows, section)}</div></div>
        </details>`;
      };

      const renderContextPanels = () => {
        const sheet = activeSheet();
        const container = document.getElementById('contextPanels');
        if (sheet.scenario === 'poster_material' || sheet.scenario === 'other_expense') {
          container.innerHTML = '';
          return;
        }
        if (sheet.scenario === 'personnel_incentive') {
          container.innerHTML = renderContextPanel(
            sheet, '结算与付款', 'settlement', 'settlement', settlementRows(sheet)
          );
          return;
        }
        const overviews = overviewRows(sheet);
        const attachmentRows = overviews.filter((row) => row.heading.startsWith('合同销售附件'));
        const overview = overviews.filter((row) => !row.heading.startsWith('合同销售附件')).map((row) => renderContextPanel(
          sheet, row.heading, 'overview', 'overview', [row]
        )).join('');
        const attachment = renderContextPanel(
          sheet, '合同销售附件｜合同主基准', 'overview', 'overview', attachmentRows
        );
        container.innerHTML = overview + attachment + renderContextPanel(
          sheet, '活动结算', 'settlement', 'settlement', settlementRows(sheet)
        );
      };

      const renderFilters = () => {
        const rows = detailRows(activeSheet());
        const counts = {
          all: rows.length,
          pass: rows.filter((row) => row.status === 'pass').length,
          issue: rows.filter((row) => row.status === 'issue').length,
        };
        document.querySelectorAll('[data-status]').forEach((button) => {
          const status = button.dataset.status;
          button.setAttribute('aria-pressed', String(status === state.status));
          button.innerHTML = `${escapeHtml(button.dataset.label)}<span class="filter-count">${counts[status]}</span>`;
        });
      };

      const renderRecords = () => {
        const sheet = activeSheet();
        const rows = currentRows();
        const total = detailRows(sheet).length;
        const unit = sheet.scenario === 'personnel_incentive'
          ? '个商品'
          : (sheet.scenario === 'poster_material' || sheet.scenario === 'other_expense' ? '个错误/人工项' : '家门店');
        document.getElementById('resultsCount').innerHTML = `已显示 <strong>${rows.length}</strong> / ${total} ${unit}`;
        if (!rows.length) {
          records.innerHTML = '<div class="empty-state"><strong>没有符合条件的记录</strong><span>请调整搜索词或核验结论。</span></div>';
          return;
        }
        records.innerHTML = rows.map((row) => {
          if (sheet.scenario === 'promotional_display') {
            const fact = displayRecordProjection(row);
            const preview = [
              withoutPrefix(fact.display, '陈列标准核验：'),
              withoutPrefix(fact.product, '现场商品：'),
            ].filter(Boolean).join(' · ');
            return `<article class="record-card display-record ${row.status}" data-section="detail">
              <details ${state.expanded ? 'open' : ''} class="record-details" data-row="${row.excel_row}">
                <summary>
                  <div class="record-title"><h3>${escapeHtml(row.heading)}</h3><p>${escapeHtml(preview)}</p></div>
                  <span class="status-pill ${row.status}">${statusText(row)}</span>
                  <div class="store-amount"><small>本店金额</small><strong>${renderSemanticText(withoutPrefix(fact.amount, '本店支持：'))}</strong></div>
                  <span class="chevron" aria-hidden="true"></span>
                </summary>
                <div class="record-body">${renderDisplayReader(sheet, row)}</div>
              </details>
            </article>`;
          }
          return `<article class="record-card ${row.status}" data-section="detail">
            <details ${state.expanded ? 'open' : ''} class="record-details" data-row="${row.excel_row}">
              <summary>
                <div class="record-title"><h3>${escapeHtml(row.heading)}</h3><p>${escapeHtml(conclusionExcerpt(row))}</p></div>
                <span class="status-pill ${row.status}">${statusText(row)}</span>
                <span class="chevron" aria-hidden="true"></span>
              </summary>
              <div class="record-body"><div class="evidence-grid">${renderEvidence(sheet, row)}</div></div>
            </details>
          </article>`;
        }).join('');
      };

      const resetScenarioState = () => {
        state.status = 'all';
        state.query = '';
        state.expanded = false;
        searchInput.value = '';
        clearSearch.hidden = true;
        expandButton.setAttribute('aria-pressed', 'false');
        expandButton.textContent = '展开全部';
      };

      const openScenario = (index) => {
        state.view = 'scenario';
        state.sheetIndex = Number(index);
        resetScenarioState();
        renderAll();
        window.scrollTo({ top: 0, behavior: 'auto' });
      };

      const renderAll = () => {
        const homeSelected = state.view === 'home';
        homeView.hidden = !homeSelected;
        scenarioView.hidden = homeSelected;
        sideActions.hidden = homeSelected;
        renderNavigation();
        if (homeSelected) {
          renderHome();
          return;
        }
        renderIntro();
        renderMetrics();
        renderContextPanels();
        renderFilters();
        renderRecords();
      };

      tabs.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        if (button.dataset.view === 'home') {
          state.view = 'home';
          resetScenarioState();
          renderAll();
          window.scrollTo({ top: 0, behavior: 'auto' });
          return;
        }
        if (button.dataset.sheet !== undefined) openScenario(button.dataset.sheet);
      });

      tabs.addEventListener('keydown', (event) => {
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
        const direction = event.key === 'ArrowRight' ? 1 : -1;
        const buttons = [...tabs.querySelectorAll('button')];
        const currentIndex = Math.max(0, buttons.indexOf(document.activeElement));
        const nextButton = buttons[(currentIndex + direction + buttons.length) % buttons.length];
        if (nextButton) {
          event.preventDefault();
          nextButton.click();
          nextButton.focus();
        }
      });

      scenarioOverview.addEventListener('click', (event) => {
        const button = event.target.closest('[data-enter-sheet]');
        if (button) openScenario(button.dataset.enterSheet);
      });

      document.getElementById('statusFilters').addEventListener('click', (event) => {
        const button = event.target.closest('[data-status]');
        if (!button) return;
        state.status = button.dataset.status;
        renderFilters();
        renderRecords();
      });
      searchInput.addEventListener('input', () => {
        state.query = searchInput.value;
        clearSearch.hidden = !state.query;
        renderRecords();
      });
      clearSearch.addEventListener('click', () => {
        state.query = '';
        searchInput.value = '';
        clearSearch.hidden = true;
        searchInput.focus();
        renderRecords();
      });
      expandButton.addEventListener('click', () => {
        state.expanded = !state.expanded;
        records.querySelectorAll('.record-card > .record-details[data-row]').forEach((detail) => { detail.open = state.expanded; });
        expandButton.setAttribute('aria-pressed', String(state.expanded));
        expandButton.textContent = state.expanded ? '收起全部' : '展开全部';
      });

      const topObserver = new IntersectionObserver(([entry]) => {
        backTop.classList.toggle('visible', !entry.isIntersecting);
      });
      topObserver.observe(document.getElementById('topSentinel'));
      backTop.addEventListener('click', () => {
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' });
      });

      renderAll();
    })();
  </script>

      const ERROR_REASON_ORDER = [

          ['结算材料', /结算单|结算材料|结算申请/],
          ['签章完整性', /签章|盖章|印章|签字/],

      const normalizedErrorReasonCategories = (values, fallback) => {

          || (labels.includes('合同门店') && !String(row.values?.[3] || '').includes('门店不一致'));
        if (hasStoreLowConfidence || hasStoreEvidenceGap) {
          const contractStore = lineWith(row.values?.[0], '门店：').replace(/^门店：/, '') || row.heading;
          const visibleLocation = lineWith(row.values?.[1], '识别地点：').replace(/^识别地点：/, '') || '未识别';
          actions.push(hasStoreLowConfidence
            ? '补充能唯一证明两处同址、商场与店铺关系或实际距离的权威地址材料；若地图确认相距较远且无法证明关联，再提交水印地点正确的现场照片'

        }

      };
      const attachmentRows = (sheet) => (sheet.rows || []).filter((row) => /^合同销售附件第\d+行｜PDF第\d+页$/.test(row.heading));
      const knowledgeErrorRows = (sheet) => attachmentRows(sheet).map((row) => {
        const comparison = String(row.values?.[3] || '');

        const knowledgeProduct = lineWith(segment, '知识库商品：').replace(/^知识库商品：/, '') || '未确认';

          if (codeProblem) {
            rows.push([
              contractRow.heading,
              fieldValue(contractRow.values?.[0], '商品名称') || '商品名称未识别',

              codeProblem,

        });

      const setManualReview = async (workspaceId, reviewed, control) => {

        if (isStaticArchive || contextApiMajor > 1 || contextApiMinor >= 24 || legacyLabelsBusy || !state.runs.length) return;

        const candidates = [...new Set([...values.slice(0, visible), ...state.runs.filter((run) => !terminalRun(run))])]

          while (candidates.length) {
