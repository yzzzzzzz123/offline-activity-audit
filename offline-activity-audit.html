            const claimed = firstNumber(afterPrefix(row.values?.[2], '视觉识别申请：'));
            const transferred = firstNumber(afterPrefix(row.values?.[3], '视觉识别转账：'));
            const difference = claimed === null || transferred === null ? null : Math.abs(claimed - transferred);
            reason = `结算单识别申请金额为${displayNumber(claimed)}元，转账凭证识别金额为${displayNumber(transferred)}元，两份材料相差${displayNumber(difference)}元。现有材料不能判断应以哪一个金额为准，因此金额证据链未闭合。`;
          } else if (row.heading === '收款人与日期') {
            source = transferFiles;
            baseline = excelFile;
            const storeCount = firstNumber(lineWith(row.values?.[1], 'Excel读取到'));
            reason = `销售Excel读取到${displayNumber(storeCount)}家门店；转账凭证目前只能确认金额，没有完整显示每笔收款人、对应门店和完整交易日期。因此无法确认Excel中的${displayNumber(storeCount)}家门店分别由谁收款、对应哪一笔转账以及具体转账日期。`;
          }
          const problem = textBlock(reason);
          return errorCard({ index: index + 1, title: row.heading, scope, source, baseline, problem, action: actionText(row), search: (row.values || []).join(' ') });
        }).join('');
        return { count: rows.length, upstream: settlementCount, local: rows.length - settlementCount, html: cards || '<div class="eo-empty">没有发现核销错误</div>' };
      };

      const displayGlobalLabels = new Set([
        '合同核心六项', '合同核心七项', '销售Excel对合同', '销售Excel对合同附件',
        '销售Excel文件内部', '合同商品知识库', '现场商品与合同',
      ]);
      const displayIssueLabels = (row) => {
        const line = lineWith(row.values?.[5], '主要问题：');
        return line ? line.slice('主要问题：'.length).split('、').map((item) => item.trim()).filter(Boolean) : [];
      };
      const displayLocalLabels = (row) => displayIssueLabels(row).filter((label) => !displayGlobalLabels.has(label));
      const displayLocalLabel = (row, label) => {
        if (!['合同门店', '门店水印错误', '门店水印缺失或无法核对'].includes(label)) return label;
        if (label !== '合同门店') return label;
        return String(row.values?.[3] || '').includes('门店不一致') ? '门店水印错误' : '门店水印缺失或无法核对';
      };
      const localDisplayProblem = (row, labels) => {
        const facts = [];
        const photo = row.values?.[1] || '';
        const compare = row.values?.[3] || '';
        if (labels.includes('活动日期')) facts.push(lineWith(photo, '识别日期：'));
        const hasStoreMismatch = labels.includes('门店水印错误')
          || (labels.includes('合同门店') && compare.includes('门店不一致'));
        const hasStoreEvidenceGap = labels.includes('门店水印缺失或无法核对')

        if (hasStoreMismatch || hasStoreEvidenceGap) {
          const contractStore = lineWith(row.values?.[0], '门店：').replace(/^门店：/, '') || row.heading;
          const visibleLocation = lineWith(photo, '识别地点：').replace(/^识别地点：/, '') || '未识别';
          if (hasStoreMismatch) {
            facts.push(`合同门店：${contractStore}`);
            facts.push(`照片水印地点：${visibleLocation}`);
            facts.push(`水印地点已清楚识别，但“${visibleLocation}”与合同门店“${contractStore}”不一致；这是门店水印错误，不是照片没看清。文件名不能覆盖水印地点冲突。`);
          } else {
            facts.push(`合同门店：${contractStore}`);
            facts.push(`照片水印地点：${visibleLocation}`);
            facts.push('照片没有提供可与合同门店核对的水印地点；文件名不能单独证明门店。');
          }
        }
        if (labels.includes('陈列标准')) {
          facts.push(lineWith(photo, '陈列标准核验：'));
          facts.push(lineWith(photo, '视觉依据：'));
        }
        if (labels.includes('现场商品知识库')) {
          facts.push(lineWith(photo, '可见文字：'));
          facts.push(lineWith(photo, '现场商品：'));
          facts.push(lineWith(photo, '知识库结论：'));
        }
        const file = lineWith(photo, '文件：');
        if (file) facts.push(file);
        return facts.filter(Boolean);

      const localDisplayAction = (row, labels) => {
        const actions = [];
        if (labels.includes('现场商品知识库')) actions.push('补拍同一商品包装：既要看清可对应知识库的名称片段、短码、规格或款式文字，也要保留足够完整的包装外观用于参考图视觉比对；文字与外观能唯一对应同一知识库商品即可，不强制拍到完整名称或69码');
        if (labels.includes('陈列标准')) actions.push('补一张完整堆头全景，能看清1平方米或数清4列');
        if (labels.includes('活动日期')) actions.push('补交能看清完整拍摄日期的现场照片');
        const hasStoreMismatch = labels.includes('门店水印错误')
          || (labels.includes('合同门店') && String(row.values?.[3] || '').includes('门店不一致'));
        const hasStoreEvidenceGap = labels.includes('门店水印缺失或无法核对')
          || (labels.includes('合同门店') && !String(row.values?.[3] || '').includes('门店不一致'));
        if (hasStoreMismatch || hasStoreEvidenceGap) {

      };
      const attachmentRows = (sheet) => (sheet.rows || []).filter((row) => /^合同销售附件第\d+行｜PDF第\d+页$/.test(row.heading));
      const knowledgeErrorRows = (sheet) => attachmentRows(sheet).map((row) => {
        const comparison = String(row.values?.[3] || '');

        if (!unresolved) return null;

  <script id="audit-system-extension-script">
    (() => {
      const contextNode = document.getElementById('audit-workbench-context');
      if (!contextNode) return;
      const context = JSON.parse(contextNode.textContent);
      const extensionStyle = document.getElementById('audit-system-extension-style');
      if (extensionStyle) document.head.appendChild(extensionStyle);

      const escapeHtml = (value) => String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
      const statusLabels = { completed: '核销完成', failed: '运行失败', running: '运行中', created: '已创建' };
      const scenarioLabels = {
        personnel_incentive: '人员激励',
        promotional_display: '堆头陈列',
        poster_material: '展示道具',
        other_expense: '其他费用',
        maintenance_fee: '维护费用',
        giveaway_promotion: '额外搭赠',
        price_difference_support: '价差补贴',
        pos_target_incentive: 'POS达标激励',
        entry_fee: '进场费用',
        self_procured_gift_material: '自采礼赠物料',
      };
      if (!Array.isArray(context.main_flow_tasks) || context.main_flow_tasks.length !== 6) {
        throw new Error('主流程任务清单必须包含六个 stage');
      }
      const monitorStages = context.main_flow_tasks.map((task, index) => ({
        key: task.stage,
        number: String(task.order || index + 1).padStart(2, '0'),
        label: task.label,
        note: task.note,
      }));
      const monitorStagePositions = [8.333, 25, 41.667, 58.333, 75, 91.667];
      const monitorStageTops = [22, 38, 20, 34, 21, 26];
      const monitorStageIndexes = Object.fromEntries(monitorStages.map((stage, index) => [stage.key, index]));
      const monitorStageLabels = {
        ...Object.fromEntries(monitorStages.map((stage) => [stage.key, stage.label])),
        ready: '结果封存',
        complete: '核销完成',
      };
      const monitorEventStages = {
        'run.created': monitorStageIndexes.bootstrap,
        'intake.completed': monitorStageIndexes.intake,
        'scenario.started': monitorStageIndexes.analysis,
        'evidence.validated': monitorStageIndexes.evidence,
        'result.validated': monitorStageIndexes.decision,
        'report.verified': monitorStageIndexes.verification,
        'run.completed': monitorStageIndexes.verification,
      };
      const state = {
        runs: [],
        primaryView: 'overview',
        query: '',
        status: 'all',
        currentTechnical: '',
        technicalSnapshot: null,
        technicalTab: 'summary',
        technicalLogLoaded: false,
        monitorWorkspace: '',
        monitorSnapshot: null,
        monitorError: '',
        monitorRequest: 0,
        primaryCatalogSignature: '',
        primaryRefreshSignature: '',
      };
      const PRIMARY_RUNNING_PROBE_MS = 2500;
      const PRIMARY_IDLE_PROBE_MS = 15000;
      let primaryProbeTimer = 0;
      let primaryProbeBusy = false;
      let recordStageProbeTimer = 0;

      const apiJson = async (path) => {
        const response = await fetch(path, { cache: 'no-store' });
        if (!response.ok) {
          let detail = '';
          try { detail = (await response.json()).error || ''; } catch (error) { detail = await response.text(); }
          throw new Error(detail || `请求失败：${response.status}`);
        }
        return response.json();
      };
      const apiText = async (path) => {
        const response = await fetch(path, { cache: 'no-store' });
        if (!response.ok) throw new Error(`请求失败：${response.status}`);
        return response.text();
      };
      const runStatus = (run) => statusLabels[run?.status] || run?.status || '状态未知';
      const runTone = (run) => run?.status === 'failed' ? '#d84b3e' : run?.status === 'running' ? '#d79a20' : '#159edb';
      const runDate = (run) => {
        const raw = String(run?.business_date || '');
        if (/^\d{8}$/.test(raw)) return `${raw.slice(0,4)}-${raw.slice(4,6)}-${raw.slice(6,8)}`;
        return raw || '日期未知';
      };
      const scenarioName = (value) => scenarioLabels[value] || value || '未知场景';
      const routeToRecord = (workspaceId) => {
        if (document.body.classList.contains('audit-system-page')) {
          try {
            sessionStorage.setItem('offline-audit-primary-state', JSON.stringify({
              view: state.primaryView,
              query: state.query,
              status: state.status,
              scrollY: window.scrollY,
            }));
          } catch (error) {}
        }
        const url = new URL(window.location.href);
        url.search = '';
        url.searchParams.set('run', workspaceId);
        url.hash = '';
        window.location.assign(url.toString());
      };
      const routeToSystem = () => {
        const url = new URL(window.location.href);
        url.search = '';
        url.hash = '';
        window.location.assign(url.toString());
      };
      const toast = (message) => {
        let node = document.getElementById('as-toast');
        if (!node) {
          node = document.createElement('div');
          node.id = 'as-toast';
          node.className = 'as-toast';
          document.body.appendChild(node);
        }
        node.textContent = message;
        node.classList.add('show');
        clearTimeout(node._hideTimer);
        node._hideTimer = setTimeout(() => node.classList.remove('show'), 2600);
      };

      const brandMarkup = (subtitle = '核销管理中心 / LEDGER SYSTEM') => `
        <div class="as-brand">
          <div class="as-brand-mark">参半<small>CANBAN</small></div>
          <div class="as-brand-copy"><strong>离线活动核销</strong><span>${escapeHtml(subtitle)}</span></div>
        </div>`;
      const primaryHeader = (subtitle) => `<header class="as-topbar"><div class="as-topbar-inner">
        ${brandMarkup(subtitle)}<div class="as-connection"><span>局域网工作台已连接</span></div>
      </div></header>`;
      const statusBadge = (run) => `<span class="as-status ${escapeHtml(run?.status || '')}">${escapeHtml(runStatus(run))}</span>`;
      const scenarioTags = (run) => {
        const values = Array.isArray(run?.scenarios) ? run.scenarios : [];
        return values.length
          ? values.map((item) => `<span class="as-tag">${escapeHtml(scenarioName(item))}</span>`).join('')
          : '<span class="as-tag">场景待识别</span>';
      };
      const runCard = (run, mode = 'ledger') => {
        const failed = run.status === 'failed';
        const countLabel = failed ? '已归档断点' : '异常明细';
        const count = failed ? Number(run.scenario_count || 0) : Number(run.error_count || 0);
        const action = mode === 'overview' ? '' : `<div class="as-run-action">
            <button class="as-button" type="button" data-as-open="${escapeHtml(run.workspace_id)}">展开核销记录 →</button></div>`;
        return `<article class="as-run-card ${mode === 'overview' ? 'informational' : 'ledger-record'}" style="--run-tone:${runTone(run)}" data-run-card="${escapeHtml(run.workspace_id)}">
          <div class="as-run-main"><small>${escapeHtml(runDate(run))} / ${escapeHtml(String(run.producer_model || 'unknown').toUpperCase())}</small>
            <h3>${escapeHtml(run.workspace_id)}</h3><p>${statusBadge(run)} · ${Number(run.scenario_count || 0)} 个核销场景</p></div>
          <div class="as-run-tags">${scenarioTags(run)}</div>
          <div class="as-run-count"><span>${countLabel}</span><strong>${count}</strong><em>${failed ? '场景' : '项'}</em></div>
          ${action}
        </article>`;
      };
      const archiveCard = (run) => `<article class="as-archive-card" style="--run-tone:${runTone(run)}">
        <div><small>${escapeHtml(runStatus(run))} / ${escapeHtml(run.storage_type || 'worktree')}</small>
          <h3>${escapeHtml(run.workspace_id)}</h3>
          <p>${escapeHtml(runDate(run))} · ${Number(run.scenario_count || 0)} 个场景 · ${Number(run.error_count || 0)} 项错误</p></div>
        <div class="as-archive-actions"><button class="as-button secondary" data-as-technical="${escapeHtml(run.workspace_id)}" type="button">日志与断点</button></div>
      </article>`;
      const emptyMarkup = (title, note) => `<div class="as-empty"><strong>${escapeHtml(title)}</strong><span>${escapeHtml(note)}</span></div>`;

      const selectedMonitorRunFrom = (runs) => runs.find((run) => run.status === 'running')
        || runs.find((run) => run.status === 'failed')
        || runs[0]
        || null;
      const selectedMonitorRun = () => selectedMonitorRunFrom(state.runs);
      const monitorStageIndex = (event) => {
        if (Number.isInteger(monitorEventStages[event?.type])) return monitorEventStages[event.type];

          ['核销场景', (run.scenarios || []).map(scenarioName).join('、') || '—'],
          ['错误总数', Number(run.error_count || 0)],
          ['分析文件', (snapshot.analysis_files || []).length],
          ['DOM 数据断点', (snapshot.dom_checkpoints || []).length],
          ['快照哈希', run.snapshot_sha256 || '—'],
        ];
        const events = (snapshot.recent_events || []).slice(-12).reverse();
        return `<div class="as-tech-summary"><article class="as-tech-card"><h3>运行身份</h3>
          <div class="as-tech-kv">${rows.map(([label,value]) => `<span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong>`).join('')}</div></article>
          <article class="as-tech-card"><h3>最近运行事件</h3><div class="as-event-list">${events.length ? events.map((event) => `<div class="as-event"><code>#${escapeHtml(event.seq || '—')}</code><strong>${escapeHtml(event.type || event.event || 'event')}<small>${escapeHtml(event.message || '')}</small></strong><time>${escapeHtml(event.timestamp || '')}</time></div>`).join('') : '<div class="as-empty">该记录没有事件日志</div>'}</div></article></div>`;
      };
      const renderTechnical = (snapshot) => {
        const analysisFiles = snapshot.analysis_files || [];
        const checkpoints = snapshot.dom_checkpoints || [];
        document.querySelector('[data-as-tech-panel="summary"]').innerHTML = technicalSummaryMarkup(snapshot);
        document.querySelector('[data-as-tech-panel="analysis"]').innerHTML = analysisFiles.length
          ? `<div class="as-resource-grid"><div class="as-resource-list">${analysisFiles.map((item) => `<button class="as-resource-button" data-as-analysis="${escapeHtml(item.path)}" type="button"><strong>${escapeHtml(item.label || item.path)}</strong><small>${escapeHtml(item.path)}</small></button>`).join('')}</div><pre class="as-code" id="as-analysis-view">选择左侧分析文件。</pre></div>`
          : emptyMarkup('没有结构化分析文件','旧版历史记录可能只包含可见核销结果');
        document.querySelector('[data-as-tech-panel="checkpoints"]').innerHTML = checkpoints.length
          ? `<div class="as-resource-grid"><div class="as-resource-list">${checkpoints.map((item) => `<button class="as-resource-button" data-as-checkpoint="${escapeHtml(item.checkpoint_id)}" type="button"><strong>${escapeHtml(item.label || item.checkpoint_id)}</strong><small>${escapeHtml(item.created_at || '')}</small></button>`).join('')}</div><pre class="as-code" id="as-checkpoint-view">选择左侧 DOM 数据断点。</pre></div>`
          : emptyMarkup('没有 DOM 数据断点','旧版历史记录没有持久化页面阶段断点');
      };
      const openTechnical = async (workspaceId) => {
        ensureTechnicalDrawer();
        state.currentTechnical = workspaceId;
        state.technicalSnapshot = null;
        state.technicalLogLoaded = false;
        document.getElementById('as-drawer-title').textContent = workspaceId;
        document.getElementById('as-drawer-backdrop').hidden = false;
        document.body.style.overflow = 'hidden';
        document.querySelector('[data-as-tech-panel="summary"]').innerHTML = '<div class="as-empty">正在读取技术档案…</div>';
        activateTechnicalTab('summary');
        try {
          const snapshot = await apiJson(`/api/runs/${encodeURIComponent(workspaceId)}/snapshot`);
          state.technicalSnapshot = snapshot;
          renderTechnical(snapshot);
        } catch (error) {
          document.querySelector('[data-as-tech-panel="summary"]').innerHTML = emptyMarkup('技术档案读取失败', error.message);
        }
      };

      const enhanceCompletedRecord = async () => {
        const run = context.run || {};
        const topbar = document.querySelector('.eo-topbar-inner');
        if (!topbar) return;
        const tools = document.createElement('div');
        tools.className = 'as-record-toolbar';
        tools.innerHTML = `<button class="as-button secondary" id="as-back-ledger" type="button">← 返回核销台账</button>
          <select class="as-record-select" id="as-record-select" aria-label="切换核销记录"><option value="${escapeHtml(context.selected_run)}">${escapeHtml(context.selected_run)}</option></select>
          <button class="as-button" id="as-record-technical" type="button">技术档案</button>`;
        topbar.appendChild(tools);
        const workspace = document.querySelector('.eo-workspace');
        if (workspace) workspace.insertAdjacentHTML('afterbegin', `<div class="as-record-context"><span>当前二级核销页面：<strong>${escapeHtml(context.selected_run)}</strong></span><span>${escapeHtml(runDate(run))} · ${escapeHtml(runStatus(run))} · ${Number(run.scenario_count || 0)} 个场景</span></div>`);
        ensureTechnicalDrawer();
        document.getElementById('as-back-ledger').addEventListener('click', routeToSystem);
        document.getElementById('as-record-technical').addEventListener('click', () => openTechnical(context.selected_run));
        document.getElementById('as-record-select').addEventListener('change', (event) => routeToRecord(event.target.value));
        try {
          const value = await apiJson('/api/runs');
          const runs = Array.isArray(value.runs) ? value.runs : [];
          const select = document.getElementById('as-record-select');
          select.innerHTML = runs.map((item) => `<option value="${escapeHtml(item.workspace_id)}">${escapeHtml(item.workspace_id)} · ${escapeHtml(runStatus(item))}</option>`).join('');
          select.value = context.selected_run;
        } catch (error) { toast(error.message); }
      };
      const renderRecordStatus = () => {
        const run = context.run || {};
        const failure = run.failure || {};
        const events = context.recent_events || [];
        document.body.className = 'audit-system-page';
        document.title = `参半渠道活动核销｜${context.selected_run}`;
        document.body.innerHTML = `${primaryHeader()}<main class="as-record-page"><div class="as-stack">
          <div class="as-record-context"><button class="as-button secondary" id="as-back-ledger" type="button">← 返回核销台账</button>
            <span>当前二级运行档案：<strong>${escapeHtml(context.selected_run)}</strong></span>
            <button class="as-button" id="as-record-technical" type="button">打开技术档案</button></div>
          <header class="as-record-status-hero" style="--run-tone:${runTone(run)}"><small>RUN RECORD / ${escapeHtml(String(run.status || 'unknown').toUpperCase())}</small>
            <h1>${escapeHtml(runStatus(run))}</h1><p>本次运行尚未形成可展示的业务核销页面，但运行身份、结构化分析、事件日志和 DOM 数据断点已经作为该条核销记录持久化保存。</p></header>
          ${failure.message ? `<div class="as-failure"><strong>${escapeHtml(failure.type || '运行失败')}</strong>${escapeHtml(failure.message)}</div>` : ''}
          <section class="as-metric-grid">
            <article class="as-metric" style="--metric-accent:#159edb"><div><span>核销场景</span><small>本次已识别场景</small></div><strong>${Number(run.scenario_count || 0)}</strong></article>
            <article class="as-metric" style="--metric-accent:#173743"><div><span>运行事件</span><small>可观察执行节点</small></div><strong>${events.length}</strong></article>
            <article class="as-metric" style="--metric-accent:#18845e"><div><span>分析文件</span><small>结构化事实与结果</small></div><strong>${(context.analysis_files || []).length}</strong></article>
            <article class="as-metric" style="--metric-accent:#d84b3e"><div><span>DOM 断点</span><small>可恢复页面阶段</small></div><strong>${(context.dom_checkpoints || []).length}</strong></article>
          </section>
          <section class="as-panel"><header class="as-panel-head"><div><small>RUN EVENT LEDGER</small><h2>运行轨迹</h2></div><p>模型私有思维过程不持久化；这里只保存可观察事件与结构化事实</p></header>
            <div class="as-panel-body"><div class="as-event-list">${events.length ? events.slice().reverse().map((event) => `<div class="as-event"><code>#${escapeHtml(event.seq || '—')}</code><strong>${escapeHtml(event.type || event.event || 'event')}<small>${escapeHtml(event.message || '')}</small></strong><time>${escapeHtml(event.timestamp || '')}</time></div>`).join('') : emptyMarkup('没有运行事件','该记录可能来自旧版结果')}</div></div></section>
        </div></main>`;
        ensureTechnicalDrawer();
        document.getElementById('as-back-ledger').addEventListener('click', routeToSystem);
        document.getElementById('as-record-technical').addEventListener('click', () => openTechnical(context.selected_run));
        if (run.status === 'running') {
          let visibleSignature = stageRefreshSignature(run, { recent_events: events });
          const probeUntilStageChanges = async () => {
            if (document.visibilityState === 'visible') {
              try {
                const snapshot = await apiJson(`/api/runs/${encodeURIComponent(context.selected_run)}/snapshot`);
                const nextSignature = stageRefreshSignature(snapshot.run || run, snapshot);
                if (nextSignature !== visibleSignature) {
                  window.location.reload();
                  return;
                }
                visibleSignature = nextSignature;
              } catch (error) {
                // 保持当前记录页稳定，下一次探测再尝试。
              }
            }
            recordStageProbeTimer = window.setTimeout(probeUntilStageChanges, PRIMARY_RUNNING_PROBE_MS);
          };
          recordStageProbeTimer = window.setTimeout(probeUntilStageChanges, PRIMARY_RUNNING_PROBE_MS);
        }
      };

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !document.getElementById('as-drawer-backdrop')?.hidden) closeTechnical();
      });

      if (context.mode === 'system') {
        renderPrimaryShell();
        loadPrimaryRuns().finally(schedulePrimaryProbe);
      } else if (context.view_available) {
        enhanceCompletedRecord();
      } else {
        renderRecordStatus();
      }
    })();
  </script>
</body>
</html>
