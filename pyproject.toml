[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-activity-audit"
version = "0.2.0"
description = "Persist deterministic offline-activity audit runs for one fixed two-level LAN system"
requires-python = ">=3.11"
dependencies = [
  "alibabacloud-oss-v2>=1.4,<2",
  "httpx>=0.27,<1",
  "jsonschema>=4.20,<5",
  "langchain-core>=1.0,<2",
  "langsmith>=0.3.45,<1",
  "mcp>=1.29,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
  "pypdf>=5,<7",
  "PyMuPDF>=1.26,<2",
  "xlrd>=2,<3"
]

[tool.setuptools]
packages = ["audit_core"]
package-dir = {"" = "skills/orchestrate-offline-audit/scripts"}
